[project]
name = "feval"
version = "0.0.1"
description = "特征前置评估原型：本地 Polars 后端 + 带真值的 mock 数据"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
